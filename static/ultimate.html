<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보구 연출 미리보기</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/royal.css"><header><a class="brand" href="/">GRAIL / DUEL</a><span>NOBLE PHANTASM · CINEMATIC</span></header><main><h1 id="skillTitle">약속된 승리의 검</h1><label>서번트 <select id="servant"><option value="saber">알트리아 · 엑스칼리버</option><option value="archer">에미야 · 무한의 검제</option><option value="lancer">쿠 훌린 · 게이 볼그</option><option value="gil">길가메시 · 에누마 엘리시</option><option value="iskandar">이스칸다르 · 왕의 군세</option><option value="medusa">메두사 · 벨레로폰</option></select></label><p>스킬명 1초 → 보구 연출 (쿠 훌린 4초 / 세이버·아처 약 7.7초 / 이스칸다르 7.5초 / 메두사 7초 / 길가메시 8초, 타이틀 포함 최대 9초) → 준비 동작 → 실제 공격<br>실제 대전에서는 연출이 끝난 뒤 공격이 발동합니다.</p><button id="play" disabled>영상을 불러오는 중…</button><div class="arena" style="margin-top:20px"><canvas id="screen" width="1280" height="660" style="width:100%;display:block;image-rendering:pixelated"></canvas></div></main><script src="/graphics.js"></script><script src="/emiya-cinema.js"></script><script src="/lancer-cinema.js"></script><script src="/gil-cinema.js"></script><script src="/rider-cinema.js"></script><script src="/cinematic.js"></script><script>
const button=document.getElementById('play'),g=document.getElementById('screen').getContext('2d');let elapsed=0,playing=false,last=0;
let duration=1+460/60;const select=document.getElementById('servant');const requested=new URLSearchParams(location.search).get('char');let char=['archer','lancer','gil','iskandar','medusa'].includes(requested)?requested:'saber';select.value=char;
function title(){duration=Math.min(9,1+(char==='iskandar'?7.5:char==='medusa'?7:char==='gil'?GilCinema.duration:char==='lancer'?LancerCinema.duration:460/60));document.getElementById('skillTitle').textContent=({iskandar:'왕의 군세',medusa:'기영의 고삐 · 벨레로폰',gil:'에누마 엘리시',archer:'무한의 검제',lancer:'게이 볼그',saber:'약속된 승리의 검'})[char]}title();
select.onchange=()=>{char=select.value;playing=false;elapsed=0;NobleCinema.draw(g,{});title();if(!button.disabled)render()};
function render(){
 const e=elapsed-duration,base={y:0,face:1,stun:0,inv:0,hp:100,mana:100,np:100,seals:3,action:'idle',anim:0};
 const a={...base,char,x:330,...(e>=0&&e<1.1?{action:'np_release',anim:1.1-e,animMax:1.1}:{})},b={...base,char:'gil',x:1020,face:-1};
 const s={players:[a,b],clock:90,round:1,score:[0,0],training:true,shots:e>=.35?[{x:330+(e-.35)*1000,y:120,v:1000,kind:'np',delay:0,owner:0}]:[],fx:[]};
 if(char==='saber'){
  if(e>=0&&e<1.4)Object.assign(a,{action:'np_release',anim:1.4-e,animMax:1.4});
  s.shots=e>=0&&e<1.4?[{x:a.x,y:0,v:0,face:1,owner:0,kind:'greatslash',elapsed:e,delay:Math.max(0,.48-e),life:1.4-e}]:[];
  s.fx=e>=.82&&e<1.27?[{x:1040,y:0,kind:'greatimpact',life:1.27-e}]:[];
 }
 if(char==='gil'){
  if(e>=0&&e<3)Object.assign(a,{action:'np_release',anim:3-e,animMax:3});
  s.shots=e>=0&&e<2.75?[{x:a.x+115,y:155,v:0,face:1,kind:'ea_beam',owner:0,delay:Math.max(0,.35-e),elapsed:Math.max(0,e-.35),life:2.4-Math.max(0,e-.35)}]:[];
 }
 if(['iskandar','medusa'].includes(char)){
  if(e>=0){a.x=Math.min(1225,330+Math.max(0,Math.min(1.3,e-.35))*900)}
  if(e>=0&&e<1.65)Object.assign(a,{action:'np_release',anim:1.65-e,animMax:1.65});
  s.shots=e>=0&&e<1.65?[{x:a.x,y:120,v:900,face:1,kind:char==='iskandar'?'army_charge':'pegasus_charge',owner:0,delay:Math.max(0,.35-e),elapsed:Math.max(0,e-.35),life:1.65-e}]:[];
 }
 GrailArt.background(g,Math.max(0,e));GrailArt.fighter(g,a,Math.max(0,e));GrailArt.fighter(g,b,0);GrailArt.effects(g,s,e);GrailArt.hud(g,s,0);
 NobleCinema.draw(g,{...s,...(e<0?{cinematic:{owner:0,char,titleDuration:1,elapsed,duration}}:{}),paused:!playing});
}
Promise.all([NobleCinema.ready,GrailArt.promise]).then(()=>{if(!GrailArt.ready)throw GrailArt.error;button.disabled=false;button.textContent='궁극기 재생';render()}).catch(e=>button.textContent=e.message);
button.onclick=()=>{elapsed=0;playing=true;last=performance.now()};
function draw(now){if(playing){elapsed=Math.min(duration+4,elapsed+(now-last)/1000);render();if(elapsed>=duration+4)playing=false}last=now;requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
