<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grail Duel · 모션 미리보기</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/royal.css"></head>
<body><header><a class="brand" href="/">✧ GRAIL / DUEL</a><span>TREASURY UPDATE 0.6</span></header>
<main><div class="intro"><div><div class="eyebrow">ANIMATION PREVIEW</div><h1>서번트 모션 갤러리</h1><p>세이버·에미야·쿠 훌린·길가메시의 동작을 확인하세요.<br>이 화면의 조작은 진행 중인 대전에 영향을 주지 않습니다.</p></div></div>
<div class="controlbar"><label>동작 <select id="motion"><option value="run">걷기</option><option value="heavy">기본 공격</option><option value="skill">스킬 / 무기 발사</option><option value="guard">가드</option><option value="jump">점프</option><option value="hurt">피격</option><option value="dash">대시</option><option value="idle">대기</option></select></label><label>재생 속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select></label><button id="pause">일시 정지</button><button id="facing">방향 전환</button><span id="status">그래픽을 불러오는 중…</span></div>
<div class="arena"><canvas id="motionCanvas" width="1280" height="620" style="width:100%;display:block;image-rendering:pixelated" aria-label="네 서번트의 모션 미리보기"></canvas></div>
<p>세 캐릭터마다 걷기 4장·공격 4장·가드·점프·피격·대시 각 1장을 추가했습니다. 길가메시의 세 발 중 가운데 발사체에 제공한 무기 이미지를 사용합니다.</p>
